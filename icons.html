};
function svg(name){const el=document.createElement('span');el.className='ri ri-'+name;const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','1.7');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.innerHTML=paths[name]||paths.rock;el.appendChild(s);return el}
function patch(root){if(!root||root.nodeType!==1&&root.nodeType!==9)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentElement;if(!p||['SCRIPT','STYLE','TEXTAREA'].includes(p.tagName)||p.closest('.ri'))return NodeFilter.FILTER_REJECT;return Object.keys(map).some(k=>n.nodeValue.includes(k))?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});const nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(const n of nodes){const text=n.nodeValue;const frag=document.createDocumentFragment();let i=0;const keys=Object.keys(map).sort((a,b)=>b.length-a.length);while(i<text.length){let hit=null;for(const k of keys)if(text.startsWith(k,i)){hit=k;break}if(hit){frag.appendChild(svg(map[hit]));i+=hit.length}else{let j=i+1;while(j<text.length&&!keys.some(k=>text.startsWith(k,j)))j++;frag.appendChild(document.createTextNode(text.slice(i,j)));i=j}}n.parentNode.replaceChild(frag,n)}}
const frame=document.getElementById('game');frame.addEventListener('load',()=>{const d=frame.contentDocument;patch(d);const mo=new MutationObserver(m=>m.forEach(x=>x.addedNodes.forEach(n=>{if(n.nodeType===1)patch(n)})));mo.observe(d.body,{subtree:true,childList:true});});
