<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020612">
<title>GPU EMPIRE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020612;color:#fff;font-family:Arial,Helvetica,sans-serif}button{font:inherit}
#game{position:relative;width:100vw;height:100vh;min-height:600px;background:#020612;overflow:hidden}
#master{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#020612}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:14px;transition:.15s;outline:none}.hot:hover{box-shadow:inset 0 0 0 2px #00d9ff,0 0 22px #00bfff88}.hot:active{transform:scale(.98)}
#toast{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);background:#06172b;display:none;padding:13px 22px;border:1px solid #19cfff;border-radius:12px;box-shadow:0 0 25px #00bfff66;z-index:20;font-weight:900}
#panel{position:absolute;inset:6% 8%;display:none;z-index:30;background:linear-gradient(145deg,#061225f8,#020713f8);border:2px solid #00bfff;border-radius:22px;box-shadow:0 0 70px #00bfff44,0 30px 100px #000;overflow:auto;padding:26px}
#panel h2{margin:0 0 18px;font-size:28px}.close{position:absolute;right:16px;top:12px;background:#ff3154;color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:900;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#071a31;border:1px solid #146fa1;border-radius:15px;padding:15px}.card b{font-size:17px}.card small{display:block;color:#8fb6d2;margin:6px 0}.act{background:#11d96b;color:#00130a;border:0;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.danger{background:#f23d55;color:#fff}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{background:#08182c;color:#fff;border:1px solid #126b98;padding:10px 14px;border-radius:9px;cursor:pointer}.tabs button.active{background:#0aa7e8;color:#fff}
#login{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:#020612eF}.loginbox{width:min(440px,92vw);background:#061225;border:2px solid #08c8ff;border-radius:22px;padding:28px;box-shadow:0 0 70px #00bfff44}.loginbox h1{margin:0 0 4px;color:#fff}.loginbox p{color:#9bb8cf}.loginbox input{width:100%;height:48px;margin:7px 0;background:#020b17;border:1px solid #1b5b7d;color:#fff;border-radius:9px;padding:0 12px}.loginbox button{width:100%;height:50px;margin-top:8px;background:#ff5b24;border:0;border-radius:10px;color:#fff;font-weight:1000;cursor:pointer}
@media(max-width:900px){#master{object-fit:cover}#panel{inset:3% 3%;padding:18px}.hot:hover{box-shadow:none}}
</style>
</head>
<body>
<div id="game">
<img id="master" alt="GPU EMPIRE master design" src="data:image/jpeg;base64,MASTER_IMAGE_BASE64">
<div id="toast"></div>
<div id="panel"><button class="close" onclick="closePanel()">✕</button><div id="panelContent"></div></div>
<div id="login"><div class="loginbox"><h1>GPU EMPIRE</h1><p>Belépés a birodalmadba</p><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Jelszó"><button onclick="login()">BELÉPÉS</button><button style="background:#0878a8" onclick="demo()">DEMO JÁTÉK</button></div></div>
</div>
<script>
const panels={
 empire:['<h2>👑 EMPIRE</h2><p>A teljes GPU-birodalmad áttekintése.</p><div class="cards"><div class="card"><b>HQ</b><small>LVL 12</small><button class="act" onclick="upgrade(\'HQ\')">FEJLESZTÉS</button></div><div class="card"><b>PC MŰHELY</b><small>LVL 3</small><button class="act" onclick="upgrade(\'PC MŰHELY\')">FEJLESZTÉS</button></div><div class="card"><b>GPU GYÁR</b><small>LVL 3</small><button class="act" onclick="upgrade(\'GPU GYÁR\')">FEJLESZTÉS</button></div></div>'],
pc:['<h2>🖥️ PC ÉPÍTŐ</h2><p>Építs és fejlessz egyedi gépeket.</p><div class="cards"><div class="card"><b>RTX 4070 EPIC</b><small>+680 POWER • +520 INCOME</small><button class="act" onclick="equip(\'RTX 4070\')">FELSZERELÉS</button></div><div class="card"><b>RTX 4090 LEGENDARY</b><small>+1400 POWER</small><button class="act" onclick="equip(\'RTX 4090\')">FELSZERELÉS</button></div><div class="card"><b>ULTIMATE BUILD</b><small>+3500 POWER</small><button class="act" onclick="equip(\'ULTIMATE GPU\')">FELSZERELÉS</button></div></div>'],
gpu:['<h2>🎮 GPU-K</h2><div class="cards">'+['GTX 1660','RTX 3060','RTX 4060','RTX 4070','RTX 4080','RTX 4090','RTX 5090','ULTIMATE GPU'].map((x,i)=>`<div class="card"><b>${x}</b><small>${i<3?'RARE':i<5?'EPIC':i<7?'LEGENDARY':'MYTHIC'}</small><button class="act" onclick="buyGpu('${x}')">VÁSÁRLÁS</button></div>`).join('')+'</div>'],
shop:['<h2>🛒 GPU BOLT</h2><div class="tabs"><button class="active">ÖSSZES</button><button>GPU</button><button>CPU</button><button>RAM</button><button>SSD</button><button>TÁP</button></div><div class="cards">'+['GTX 1660 — 150 000 Ft','RTX 3060 — 320 000 Ft','RTX 4060 — 450 000 Ft','RTX 4070 — 950 000 Ft','RTX 4080 — 1 650 000 Ft','RTX 4090 — 2 450 000 Ft','RTX 5090 — 4 500 000 Ft','ULTIMATE GPU — 10 000 000 Ft'].map(x=>`<div class="card"><b>${x.split(' — ')[0]}</b><small>${x.split(' — ')[1]}</small><button class="act" onclick="toastMsg('Vásárlás: ${x.split(' — ')[0]}')">VÁSÁRLÁS</button></div>`).join('')+'</div>'],
inv:['<h2>📦 RAKTÁR</h2><div class="cards">'+['RTX 4060 ×2','RTX 4070 ×1','RTX 4090 ×1','i7-13700K ×1','Ryzen 7 7800X3D ×1','32GB DDR5 ×4','1TB NVMe ×3','850W PSU ×2','RGB HŰTÉS ×1','PC HÁZ ×1','LEGENDARY CASE ×2','EPIC CASE ×5'].map(x=>`<div class="card"><b>${x}</b><small>Raktáron</small></div>`).join('')+'</div>'],
upgrade:['<h2>🏗️ ÉPÜLETEK FEJLESZTÉSE</h2><div class="cards"><div class="card"><b>PC MŰHELY LVL 3 → LVL 4</b><small>+170 GPU POWER • +25 000 Ft/óra</small><button class="act" onclick="upgrade(\'PC MŰHELY\')">FEJLESZTÉS</button></div><div class="card"><b>GPU GYÁR LVL 3</b><small>Gyártási kapacitás növelése</small><button class="act" onclick="upgrade(\'GPU GYÁR\')">FEJLESZTÉS</button></div></div>'],
quests:['<h2>🎯 KÜLDETÉSEK</h2><div class="cards"><div class="card"><b>Pörgess 10-szer</b><small>7 / 10 • Jutalom: 25 000 Ft + 20 XP</small><button class="act" onclick="toastMsg(\'Küldetés folytatás\')">FOLYTATÁS</button></div><div class="card"><b>Építs 5 PC-t</b><small>2 / 5 • RARE CASE</small><button class="act" onclick="toastMsg(\'Küldetés folytatás\')">FOLYTATÁS</button></div><div class="card"><b>Vásárolj 1 GPU-t</b><small>1 / 1 • 50 000 Ft</small><button class="act" onclick="toastMsg(\'Küldetés kész\')">KÉSZ</button></div></div>'],
rank:['<h2>🏆 RANGLISTA</h2><div class="cards">'+['GPU_MASTER — 45 250 000 Ft — LVL 78','TechKing — 38 450 000 Ft — LVL 72','RTX_HUN — 29 180 000 Ft — LVL 65','PC_Builder — 24 650 000 Ft — LVL 60','DávidPro — 18 400 000 Ft — LVL 54','CSORBA DÁVID — 5 450 000 Ft — LVL 12'].map((x,i)=>`<div class="card"><b>${i+1}. ${x}</b></div>`).join('')+'</div>'],
friends:['<h2>👥 BARÁTOK</h2><div class="cards">'+['GPU_MASTER • Online • LVL 78','TechKing • Online • LVL 72','RTX_HUN • Offline • LVL 65','GamerTom • Online • LVL 48','PC_Builder • Offline • LVL 60'].map(x=>`<div class="card"><b>${x}</b><button class="act" onclick="toastMsg(\'Játékos megnyitva\')">MEGNÉZ</button></div>`).join('')+'</div>'],
spin:['<h2>🎰 PÖRGETÉS</h2><p>Napi limit: 15/50 • 1 energia / pörgetés</p><div class="card" style="text-align:center;font-size:28px">🎮 • 💰 • XP • ⚡ • 🎁 • 💎</div><button class="act" style="width:100%;margin-top:15px;font-size:22px" onclick="spin()">PÖRGETÉS ⚡ 1 ENERGY</button>']
};
function openPanel(k){$('panelContent').innerHTML=panels[k]||'<h2>GPU EMPIRE</h2>';$('panel').style.display='block'}function closePanel(){$('panel').style.display='none'}function $(x){return document.getElementById(x)}function toastMsg(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}function upgrade(x){toastMsg(x+' fejlesztés elindítva')}function equip(x){toastMsg(x+' felszerelve')}function buyGpu(x){toastMsg(x+' megvásárolva')}function spin(){const r=['+25 000 Ft','+500 XP','+100 kristály','RARE CASE','+50 000 Ft','JACKPOT +250 000 Ft'];toastMsg('🎉 '+r[Math.floor(Math.random()*r.length)])}function demo(){localStorage.setItem('gpu_demo','1');$('login').style.display='none';toastMsg('Demo játék betöltve')}async function login(){try{const r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',email:$('email').value,password:$('pass').value})});if(!r.ok)throw Error('Hibás bejelentkezés');$('login').style.display='none';toastMsg('Sikeres belépés')}catch(e){toastMsg(e.message)}}
// Hotspots follow the exact master image layout. They open the functional screens without altering the master graphic.
const hs=[
['empire',0,0,14,17],['spin',68,0,32,38],['quests',0,13,11,23],['rank',0,34,11,24],['friends',0,58,11,22],['pc',1,62,34,38],['shop',35,62,35,38],['inv',71,62,29,38],['upgrade',1,85,29,15],['quests',30,85,30,15],['rank',60,85,20,15],['friends',80,85,20,15],['shop',40,35,12,10],['inv',54,35,11,10],['upgrade',26,35,12,10],['empire',45,15,15,13],['gpu',61,38,13,10],['spin',0,86,8,10],['pc',10,86,9,10],['gpu',18,86,10,10],['shop',28,86,9,10],['spin',37,86,9,10]];
hs.forEach(([k,l,t,w,h])=>{const b=document.createElement('button');b.className='hot';b.style.left=l+'%';b.style.top=t+'%';b.style.width=w+'%';b.style.height=h+'%';b.onclick=()=>openPanel(k);$('game').appendChild(b)});
if(localStorage.getItem('gpu_demo')) toastMsg('GPU EMPIRE betöltve');
</script>
</body>
</html>
