<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030303"><title>Croptott Bányász Birodalom</title><style>*{box-sizing:border-box}body{margin:0;background:#030303;color:#f2ead9;font-family:Inter,system-ui,sans-serif}button,input{font:inherit}.top{height:72px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(#0b0a08,#030303);border-bottom:1px solid #735521;position:sticky;top:0;z-index:20}.brand{margin-right:auto;color:#e9c15b;font:700 18px Georgia}.brand small{display:block;color:#9b865e;font:7px Inter;letter-spacing:.16em}.wallet{padding:8px 11px;background:#0b0a08;border:1px solid #4e3d20;border-radius:7px;color:#f1c95d;font-weight:900;font-size:12px}.user{padding:7px 9px;background:#0a0907;border:1px solid #493a20;border-radius:7px;font-size:9px}.logout{border:1px solid #5e481f;background:#171107;color:#e9c25a;border-radius:7px;padding:8px;cursor:pointer}.layout{display:flex}.side{width:220px;min-height:calc(100vh - 72px);padding:12px 8px;background:#090908;border-right:1px solid #4a381d;position:sticky;top:72px}.side button{display:block;width:100%;min-height:46px;margin:3px 0;padding:8px;border:1px solid transparent;border-radius:7px;background:transparent;color:#aaa08d;text-align:left;cursor:pointer;font-size:10px}.side button.active,.side button:hover{background:#2a200e;border-color:#ad812c;color:#ffe18a}.main{width:min(1180px,100%);margin:auto;padding:14px 16px 40px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:linear-gradient(145deg,#12110d,#070706 75%);border:1px solid #4e3b1e;border-radius:9px;padding:14px;box-shadow:0 12px 38px #000b}.hero{grid-column:span 2;min-height:235px;display:flex;flex-direction:column;justify-content:space-between}.eyebrow{color:#a48b59;font-size:8px;letter-spacing:.15em;font-weight:900}.hero h1,.card h2{color:#e7c15b;font-family:Georgia,serif}.hero h1{font-size:29px;margin:6px 0}.muted{color:#827765;font-size:10px;line-height:1.5}.stat b{display:block;color:#f0c95d;font-size:23px;margin:6px 0}.gold{background:linear-gradient(#f2c65a,#a76514);border:1px solid #ffe18b;color:#1b1205;padding:12px 15px;border-radius:6px;font-weight:900;cursor:pointer}.gold:disabled{opacity:.45}.section{margin-top:12px}.ores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.ore{padding:10px;background:#0d0d0b;border:1px solid #3b301e;border-radius:6px}.ore b{display:block;font-size:10px}.ore small{color:#756b5b;font-size:8px}.ore strong{display:block;color:#e7c35d;margin-top:5px;font-size:10px}.ore button{width:100%;margin-top:7px}.rows{display:grid;gap:6px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px;background:#0d0d0b;border:1px solid #3b301e;border-radius:6px;font-size:9px}.row small{display:block;color:#756b5b;font-size:7px;margin-top:3px}.msg{margin-bottom:8px;padding:9px;background:#171208;border:1px solid #735724;border-radius:6px;color:#e9c65e;font-size:9px}.mobile{display:none}.auth{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 10%,#2b1d0c,#030303 60%)}.authbox{width:min(420px,100%);padding:22px;background:#0d0c09;border:1px solid #725727;border-radius:10px}.auth h1{color:#eec65d;font:700 28px Georgia}.auth input{display:block;width:100%;padding:11px;margin:6px 0;background:#080807;color:#fff;border:1px solid #4a381e;border-radius:6px}.auth button{margin-top:5px}.switch{margin-top:10px;color:#8d806c;font-size:9px}.switch b{color:#e9c15b;cursor:pointer}.hidden{display:none!important}.scene{height:330px;margin:10px 0;border:1px solid #6a5024;border-radius:7px;display:grid;place-items:center;background:radial-gradient(circle,#493516,#080806 70%);font-size:120px;position:relative}.hp{position:absolute;right:8px;bottom:8px;width:170px;padding:8px;background:#070706e8;border:1px solid #634a21;border-radius:6px;font-size:8px}.bar{height:6px;background:#211a10;margin:4px 0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a66a1b,#efc658)}
@media(max-width:900px){.top{height:70px;padding:6px 8px}.user,.logout{display:none}.side{display:none}.main{padding:8px 7px 88px}.grid{grid-template-columns:1fr 1fr}.hero{grid-column:span 2}.ores{grid-template-columns:1fr}.mobile{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;z-index:50;padding:5px 4px calc(5px + env(safe-area-inset-bottom));background:#030303f5;border-top:1px solid #6b5126}.mobile button{min-height:58px;border:0;background:transparent;color:#8d846f;font-size:8px}.mobile button.active{background:#241a09;color:#f0c75b;border-bottom:3px solid #efc34e}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{grid-column:span 1}.hero h1{font-size:25px}.brand{font-size:14px}.wallet{font-size:10px}.card{padding:10px}}
</style></head><body><div id="root"></div><script>let tab='mine',data=null;const root=document.getElementById('root');const money=n=>Number(n||0).toLocaleString('hu-HU')+' Ft';async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});const j=await r.json();if(!r.ok)throw Error(j.error||'Hiba');return j}function auth(){return localStorage.croptott==='1'}function login(){root.innerHTML='<main class="auth"><section class="authbox"><div class="brand">⛏ CROPTOTT<small>BÁNYÁSZ BIRODALOM</small></div><h1>Belépés</h1><p class="muted">Saját játékosfiók, külön mentett adatokkal.</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Jelszó"><input id="name" placeholder="Név (regisztrációhoz)"><button class="gold" onclick="reg()">REGISZTRÁCIÓ</button><button class="gold" onclick="log()">BELÉPÉS</button><p id="err" class="muted"></p></section></main>'}async function log(){try{await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});localStorage.croptott='1';load()}catch(e){err.textContent=e.message}}async function reg(){try{await api('/api/register',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value,name:name.value})});localStorage.croptott='1';load()}catch(e){err.textContent=e.message}}function nav(){return [['mine','⛏ Bánya'],['market','◆ Piac'],['machines','⚙ Gépek'],['finance','₣ Pénzügy'],['transactions','↕ Tranzakciók'],['profile','👤 Profil'],['arena','🏟 Aréna'],['race','🏎 Bányakocsi'],['combine','💎 Kombináló'],['empire','🏰 Birodalom'],['challenge','🎯 Kihívások']]}function render(){const p=data.profile;let side=nav().map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('');let body='';if(tab==='mine')body=`<div class="grid"><div class="card stat"><span class="eyebrow">EGYENLEG</span><b>${money(p.balanceHuf)}</b><span class="muted">Virtuális játékérték</span></div><div class="card stat"><span class="eyebrow">SZINT</span><b>LV. ${p.level}${p.level>=1000?' · MAX':''}</b><span class="muted">${p.xp.toLocaleString('hu-HU')} XP</span></div><div class="card stat"><span class="eyebrow">ÜTÉSEK</span><b>${p.rockHits.toLocaleString('hu-HU')}</b><span class="muted">bányászati ütések</span></div><section class="card hero"><div><span class="eyebrow">PRÉMIUM BÁNYÁSZATI KÖZPONT</span><h1>A MÉLYSÉG A TIÉD</h1><p class="muted">Bányássz, gyűjts ritka érceket, fejleszd a felszerelésedet és építsd fel a Croptott Bányász Birodalmat.</p></div><button class="gold" onclick="mine('normal')">⛏ BÁNYÁSZÁS</button></section></div><section class="card section"><span class="eyebrow">KŐZETEK</span><h2>Fokozatosan nehezedő bányák</h2><div class="ores">${data.rocks.map(r=>`<article class="ore"><b>◆ ${r.displayName}</b><small>LV. ${r.requiredLevel} · ${r.health} HP</small><button class="gold" ${p.level<r.requiredLevel?'disabled':''} onclick="mine('${r.rockType}')">⛏ Bányász</button></article>`).join('')}</div></section>`;else if(tab==='market')body=`<section class="card"><span class="eyebrow">◆ PIAC</span><h2>Ércek és árak</h2><div class="ores">${data.inventory.map(o=>`<article class="ore"><b>${o.displayName}</b><small>Készlet: ${o.quantity} db</small><strong>${money(o.priceHuf)}/db</strong><button class="gold" onclick="sell('${o.oreType}',${o.quantity})">ELADÁS</button></article>`).join('')}</div></section>`;else if(tab==='machines')body=`<section class="card"><span class="eyebrow">⚙ GÉPEK</span><h2>Bányagépek</h2><div class="rows">${data.machines.map(m=>`<div class="row"><span><b>${m.name}</b><small>Erő ${m.power} · ${m.interval} mp</small></span><span>${m.level?'LV. '+m.level:'Nincs megvéve'} <button class="gold" onclick="buyMachine(${m.id})">${m.level?'Fejlesztés':'Vásárlás'}</button></span></div>`).join('')}</div></section>`;else if(tab==='transactions')body=`<section class="card"><span class="eyebrow">↕ TRANZAKCIÓK</span><h2>Teljes pénzügyi napló</h2><div class="rows">${data.transactions.map(t=>`<div class="row"><span>${t.note||t.type}<small>${new Date(t.createdAt).toLocaleString('hu-HU')}</small></span><b>${money(t.totalHuf)}</b></div>`).join('')||'<p class="muted">Még nincs tranzakció.</p>'}</div></section>`;else if(tab==='profile')body=`<section class="card"><span class="eyebrow">👤 PROFIL</span><h2>${p.characterName}</h2><input id="newname" value="${p.characterName}" style="width:100%;padding:10px;background:#080807;color:#fff;border:1px solid #4a381e;border-radius:6px"><button class="gold" onclick="saveName()">NÉV MENTÉSE</button><div class="rows" style="margin-top:8px"><div class="row"><span>Szint</span><b>LV. ${p.level}</b></div><div class="row"><span>XP</span><b>${p.xp}</b></div><div class="row"><span>Ütések</span><b>${p.rockHits}</b></div></div></section>`;else{const n={finance:'Pénzügy',arena:'Bánya-aréna',race:'Bányakocsi',combine:'Érc-kombináló',empire:'Birodalom',challenge:'Kihívások'}[tab];body=`<section class="card"><span class="eyebrow">KÜLÖN FUNKCIÓ</span><h2>${n}</h2><p class="muted">Ez a játékmód a szerveroldali Croptott rendszerhez kapcsolódik.</p><button class="gold" onclick="side('${tab}')">JÁTÉK INDÍTÁSA</button></section>`}root.innerHTML=`<header class="top"><div class="brand">⛏ CROPTOTT<small>BÁNYÁSZ BIRODALOM</small></div><div class="wallet">${money(p.balanceHuf)}</div><div class="user">${p.characterName} · LV ${p.level}</div><button class="logout" onclick="logout()">Kilépés</button></header><div class="layout"><aside class="side">${side}</aside><main class="main">${body}<div id="msg"></div></main></div><nav class="mobile">${nav().slice(0,4).map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}<button onclick="tab='profile';render()">👤 Profil</button></nav>`}async function load(){try{data=await api('/api/dashboard');render()}catch(e){localStorage.removeItem('croptott');login()}}async function mine(rock){try{const r=await api('/api/mine',{method:'POST',body:JSON.stringify({rock})});data=await api('/api/dashboard');render();toast(`+${r.oreFound.quantity} ${r.oreFound.displayName} · +${r.xpGained} XP`)}catch(e){toast(e.message)}}async function sell(ore,max){if(!max)return toast('Nincs készlet.');const q=prompt('Eladandó mennyiség:',String(Math.min(1,max)));if(!q)return;try{await api('/api/sell',{method:'POST',body:JSON.stringify({ore,quantity:Number(q)})});data=await api('/api/dashboard');render()}catch(e){toast(e.message)}}async function buyMachine(id){try{await api('/api/buy-machine',{method:'POST',body:JSON.stringify({id})});data=await api('/api/dashboard');render()}catch(e){toast(e.message)}}async function saveName(){try{await api('/api/profile',{method:'POST',body:JSON.stringify({name:newname.value})});data=await api('/api/dashboard');render()}catch(e){toast(e.message)}}async function side(action){try{const r=await api('/api/side',{method:'POST',body:JSON.stringify({action})});data=await api('/api/dashboard');render();toast(r.message)}catch(e){toast(e.message)}}async function logout(){await api('/api/logout');localStorage.removeItem('croptott');login()}function toast(t){const x=document.getElementById('msg');if(!x)return;x.className='msg';x.textContent=t;setTimeout(()=>x.textContent='',3000)}api('/api/session').then(x=>x.authenticated?(localStorage.croptott='1',load()):login()).catch(login);</script></body></html>
