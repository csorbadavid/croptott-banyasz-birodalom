<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030303"><title>Croptott Bányász Birodalom</title><style>
*{box-sizing:border-box}html,body{margin:0;min-width:0;background:#030303;color:#f2ead9;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.app{min-height:100vh}.top{height:72px;display:flex;align-items:center;gap:12px;padding:0 16px;background:linear-gradient(#0a0907,#030303);border-bottom:1px solid #735521;position:sticky;top:0;z-index:80}.brand{display:flex;align-items:center;gap:9px;margin-right:auto}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#d9a945,#3b270b 72%);border:2px solid #b9872b;font-size:22px}.brand b{display:block;color:#e9c15b;font:700 17px Georgia,serif;letter-spacing:.1em}.brand small{color:#9b865e;font-size:8px}.balance{padding:7px 12px;background:#0b0a08;border:1px solid #4e3d20;border-radius:7px;text-align:right}.balance span{display:block;color:#81745e;font-size:7px}.balance b{color:#f1c95d;font-size:13px}.user{padding:7px 10px;background:#0a0907;border:1px solid #493a20;border-radius:7px}.user b,.user small{display:block}.user b{font-size:10px}.user small{font-size:8px;color:#d5ad55}.logout{border:1px solid #5e481f;background:#171107;color:#e9c25a;border-radius:7px;padding:8px 10px;cursor:pointer}.layout{display:flex;min-height:calc(100vh - 72px)}.side{width:220px;flex:none;padding:15px 9px;background:linear-gradient(#090908,#030303);border-right:1px solid #4a381d;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.caption{padding:3px 10px 9px;color:#806c45;font-size:8px;letter-spacing:.22em}.side button{display:flex;width:100%;align-items:center;gap:9px;min-height:48px;margin-bottom:4px;padding:7px 9px;border:1px solid transparent;border-radius:7px;background:transparent;color:#aaa08d;text-align:left;cursor:pointer}.side button:hover,.side button.active{background:linear-gradient(90deg,#3a2b10,#151007);border-color:#ad812c;color:#ffe18a}.main{width:min(1180px,100%);margin:auto;padding:14px 16px 40px}.hero{display:none}.grid2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(255px,.75fr);gap:12px}.card,.panel{background:linear-gradient(145deg,#12110d,#070706 75%);border:1px solid #4e3b1e;border-radius:9px;padding:14px;box-shadow:0 12px 38px #000b}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.head h2,.title h2{margin:4px 0 0;color:#e7c15b;font:700 18px Georgia,serif}.head span,.title span{color:#a48b59;font-size:8px;letter-spacing:.15em;font-weight:900}.pill{padding:5px 7px;border-radius:5px;background:#171209;border:1px solid #725727;color:#e3bd56;font-size:7px}.scene{height:430px;margin:10px 0;border-radius:7px;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 45%,#3b2a12,#090806 65%,#020202);border:1px solid #6a5024;display:grid;place-items:center}.miner{font-size:150px;filter:drop-shadow(0 15px 18px #000)}.scene:after{content:'⛏';position:absolute;right:16%;top:42%;font-size:90px;transform:rotate(-28deg);filter:drop-shadow(0 8px 8px #000)}.hp{position:absolute;right:8px;bottom:8px;width:170px;padding:8px;background:#070706eb;border:1px solid #634a21;border-radius:6px}.hp b{font-size:7px;color:#9d8a64}.bar{height:6px;margin:4px 0;background:#211a10;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a66a1b,#efc658)}.hp strong{font-size:8px}.goldbtn{width:100%;min-height:50px;border-radius:6px;background:linear-gradient(#f2c65a,#a76514);border:1px solid #ffe18b;color:#1b1205;font-weight:900;cursor:pointer}.goldbtn:disabled{opacity:.5}.info{display:block}.character{height:160px;margin:10px 0;border:1px solid #57421f;border-radius:7px;background:radial-gradient(circle,#4a3518,#080806 70%);display:grid;place-items:center;font-size:70px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stats>div{padding:9px;background:#0e0d0a;border:1px solid #382d1c;border-radius:6px}.stats span{display:block;color:#766d5d;font-size:7px}.stats b{display:block;color:#e6dcc8;font-size:11px;margin-top:3px}.section{margin-top:12px}.title{margin-bottom:9px}.rocks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.rocks button{min-height:65px;padding:8px;text-align:left;border-radius:6px;background:linear-gradient(145deg,#15130e,#090908);border:1px solid #3e321f;color:#e2d7c0;cursor:pointer}.rocks button.active{border-color:#d0a744;background:linear-gradient(145deg,#2a210f,#100e09)}.rocks button.lock{opacity:.38}.rocks b,.rocks small{display:block}.rocks b{font-size:9px}.rocks small{margin-top:5px;color:#7b715f;font-size:7px}.split{display:grid;grid-template-columns:1.5fr .75fr;gap:12px;margin-top:12px}.list{max-height:360px;overflow:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:1px solid #292116}.row span{font-size:9px}.row small{display:block;color:#6f6655;font-size:7px}.row strong{color:#e5c15a;font-size:9px}.member{text-align:center;padding:18px;border:1px solid #735727;border-radius:8px;background:radial-gradient(circle at 50% 10%,#493516,#080806 72%)}.member b{display:block;color:#e7c35f;font-size:38px}.oregrid,.cards,.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.ore,.machine,.price{padding:11px;background:#0d0d0b;border:1px solid #3b301e;border-radius:6px}.oretop{display:flex;justify-content:space-between}.oreicon{font-size:26px}.ore b,.machine b{display:block;font-size:10px;color:#e5dcc8;margin-top:5px}.ore small,.machine small{display:block;color:#786e5b;font-size:8px;margin-top:3px}.ore .sell{display:flex;gap:5px;margin-top:8px}.sell input{width:100%;background:#080807;color:#fff;border:1px solid #3d321f;border-radius:5px;padding:7px}.sell button{background:#171208;color:#e8c45e;border:1px solid #735727;border-radius:5px;padding:7px 10px;cursor:pointer}.price b{display:block;color:#e7c35d;font-size:10px;margin-top:5px}.finance{display:grid;grid-template-columns:1fr 1fr;gap:12px}.finance input,.auth input{width:100%;margin:5px 0;padding:11px;background:#080807;color:#fff;border:1px solid #4a381e;border-radius:6px}.feature{display:flex;align-items:center;gap:14px}.featureicon{width:72px;height:72px;display:grid;place-items:center;border-radius:10px;background:radial-gradient(circle,#4b3516,#0b0a07);border:1px solid #755a27;font-size:40px}.feature p{color:#817562;font-size:9px}.toast{position:fixed;right:16px;bottom:16px;z-index:900;background:#e8c45e;color:#1b1205;padding:12px 16px;border-radius:7px;font-weight:900;display:none}.mobile{display:none}.auth{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#2b1d0c,#030303 55%);padding:20px}.authbox{width:min(420px,100%);padding:22px;background:linear-gradient(145deg,#15130e,#070706);border:1px solid #725727;border-radius:10px;box-shadow:0 30px 100px #000}.auth h1{font:700 28px Georgia,serif;color:#eec65d}.auth p{color:#8d806c;font-size:10px}.auth button{margin-top:8px}.switch{margin-top:10px;color:#9b8d75;font-size:9px}.switch a{color:#e9c15b;cursor:pointer}.hidden{display:none!important}.modal{position:fixed;inset:0;z-index:700;background:#000d;display:grid;place-items:center;padding:15px}.modalbox{width:min(440px,100%);padding:18px;background:#0d0c09;border:1px solid #735727;border-radius:9px}.modalbox h2{color:#e7c15b;font:700 20px Georgia,serif}
@media(max-width:900px){.top{height:76px;padding:6px 9px}.brand b{font-size:14px}.brand small{font-size:7px}.user,.logout{display:none}.balance{padding:7px}.side{display:none}.layout{display:block;min-height:0}.main{padding:7px 7px 92px}.grid2,.split,.finance{display:block}.info{margin-top:8px}.scene{height:clamp(285px,78vw,380px)}.rocks{grid-template-columns:repeat(2,1fr)}.oregrid,.cards,.prices{grid-template-columns:1fr}.mobile{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);left:0;right:0;bottom:0;z-index:800;padding:5px 4px calc(5px + env(safe-area-inset-bottom));background:#030303f5;border-top:1px solid #6b5126}.mobile button{min-height:60px;border:0;border-radius:8px;background:transparent;color:#8d846f;font-size:8px}.mobile button.active{background:#241a09;color:#f0c75b;border-bottom:3px solid #efc34e}.feature{display:grid;grid-template-columns:65px 1fr}.feature button{grid-column:1/-1}.hp{width:46%}}
@media(max-width:520px){.brand b{font-size:12px}.balance b{font-size:10px}.main{padding-left:6px;padding-right:6px}.scene{height:300px}.card,.panel{padding:9px}.head h2,.title h2{font-size:17px}}
</style></head><body><div id="root"></div><script>
const $=s=>document.querySelector(s),api=async(p,opt={})=>{const r=await fetch('/api'+p,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'Hiba');return d};let data=null,tab='mine';
function money(n){return Number(n||0).toLocaleString('hu-HU')+' Ft'}
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display='none',2200)}
function auth(){document.body.innerHTML='<main class="auth"><section class="authbox"><div class="avatar">⛏</div><h1>CROPTOTT</h1><p>Teljes értékű bányászati birodalom. Regisztrálj vagy lépj be.</p><div id="form"></div></section></main>';loginForm()}
function loginForm(){ $('#form').innerHTML='<h2>Belépés</h2><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Jelszó"><button class="goldbtn" id="go">BELÉPÉS</button><div class="switch">Nincs fiókod? <a id="reg">Regisztráció</a></div>';$('#go').onclick=async()=>{try{await api('/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#pass').value})});await start()}catch(e){toast(e.message)}};$('#reg').onclick=registerForm}
function registerForm(){ $('#form').innerHTML='<h2>Új bányász</h2><input id="name" placeholder="Bányász neve"><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Jelszó (min. 6 karakter)"><button class="goldbtn" id="go">REGISZTRÁCIÓ</button><div class="switch">Van már fiókod? <a id="log">Belépés</a></div>';$('#go').onclick=async()=>{try{await api('/register',{method:'POST',body:JSON.stringify({name:$('#name').value,email:$('#email').value,password:$('#pass').value})});await start()}catch(e){toast(e.message)}};$('#log').onclick=loginForm}
function shell(){document.body.innerHTML='<div class="app"><header class="top"><div class="brand"><div class="avatar">⛏</div><div><b>BÁNYÁSZ BIRODALOM</b><small id="uname">Bányász</small></div></div><div class="balance"><span>EGYENLEG</span><b id="bal">0 Ft</b></div><div class="user"><b id="topname"></b><small id="lvl"></small></div><button class="logout" id="logout">Kilépés</button></header><div class="layout"><aside class="side"><div class="caption">BIRODALOM</div><div id="nav"></div></aside><main class="main" id="main"></main></div><nav class="mobile" id="mob"></nav></div><div id="toast" class="toast"></div>'}
const nav=[['mine','⛏','Bánya'],['cave','◈','Bányász Barlang'],['market','◆','Piac'],['machines','⚙','Gépek'],['finance','₣','Pénzügy'],['transactions','↕','Tranzakciók'],['profile','●','Profil'],['arena','♜','Bánya-aréna'],['race','🏎','Bányakocsi'],['combine','◆','Érc-kombináló'],['empire','♜','Birodalom'],['challenge','🎯','Kihívások']];
function navRender(){const h=nav.map(n=>`<button data-tab="${n[0]}">${n[1]} <b>${n[2]}</b></button>`).join('');$('#nav').innerHTML=h;$('#mob').innerHTML=nav.slice(0,4).map(n=>`<button data-tab="${n[0]}">${n[1]}<br>${n[2]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function baseHead(label,title){return `<div class="title"><span>${label}</span><h2>${title}</h2></div>`}
function minePage(){const p=data.profile,active=data.rocks.find(r=>r.rockType===window.rock)||data.rocks[0];return `<div class="grid2"><section class="card"><div class="head"><div><span>⛏ BÁNYÁSZ</span><h2>${active.displayName}</h2></div><em class="pill">LV. ${active.requiredLevel}+</em></div><div class="scene"><div class="miner">👷</div><div class="hp"><b>KŐ ÉLETERŐ</b><div class="bar"><i style="width:100%"></i></div><strong>${active.health} / ${active.health} HP</strong></div></div><button class="goldbtn" id="mineBtn">⛏ BÁNYÁSZ</button></section><section class="card info"><div class="head"><div><span>AKTUÁLIS BÁNYÁSZ</span><h2>${p.characterName}</h2></div><b class="pill">LV. ${p.level}${p.level>=1000?' · MAX':''}</b></div><div class="character">👷</div><div class="stats"><div><span>ERŐ</span><b>×${data.tools.find(t=>t.equipped)?.power||1}</b></div><div><span>ÜTÉS</span><b>${p.rockHits.toLocaleString('hu-HU')}</b></div><div><span>XP</span><b>${p.xp.toLocaleString('hu-HU')}</b></div><div><span>ÉRC</span><b>${data.inventory.reduce((s,o)=>s+o.quantity,0)}</b></div></div></section></div><section class="panel section">${baseHead('KŐZETEK','Fokozatosan egyre keményebb bányák')}<div class="rocks">${data.rocks.map(r=>`<button class="${p.level>=r.requiredLevel?'':'lock'} ${r.rockType===active.rockType?'active':''}" data-rock="${r.rockType}"><b>◆ ${r.displayName}</b><small>LV. ${r.requiredLevel} · ${r.health} HP</small></button>`).join('')}</div></section>`}
function marketPage(){return `<section class="panel">${baseHead('◆ PIAC','Érc készlet és eladás')}<div class="oregrid">${data.inventory.map(o=>`<article class="ore"><div class="oretop"><span class="oreicon">◆</span><small>${o.quantity} db</small></div><b>${o.displayName}</b><small>${money(o.priceHuf)}/db</small><div class="sell"><input id="q-${o.oreType}" type="number" min="1" placeholder="Mennyiség"><button data-sell="${o.oreType}">Elad</button></div></article>`).join('')}</div></section><section class="panel section">${baseHead('📈 PIACI ÁRAK','Aktuális ércárak')}<div class="prices">${data.market.map(o=>`<div class="price"><span>◆ ${o.displayName}</span><b>${money(o.priceHuf)}</b><small>Ritkaság ${o.rarity}</small></div>`).join('')}</div></section>`}
function machinesPage(){return `<section class="panel">${baseHead('⚙ GÉPEK','Bányagépek és fejlesztések')}<div class="cards">${data.machines.map(m=>`<article class="machine"><b>${m.name}</b><small>Erő ${m.power} · ${m.interval} mp</small><strong>${m.level?'LV. '+m.level:'Nincs megvéve'}</strong>${m.level?'':'<button class="goldbtn buy-machine" data-id="'+m.id+" style="margin-top:8px">Vásárlás · "+money(m.upgradeCost)+' </button>'}</article>`).join('')}</div></section><section class="panel section">${baseHead('⛏ ESZKÖZÖK','Csákányok LV. 1–1000')}<div class="cards">${data.tools.map(t=>`<article class="machine"><b>${t.displayName}</b><small>LV. ${t.requiredLevel} · Erő ${t.power} · ${money(t.priceHuf)}</small><strong>${t.owned?'Saját LV. '+t.level:'Zárolva / vásárolható'}</strong>${t.owned?'<button class="sell equip" data-id="'+t.id+'">'+(t.equipped?'Felszerelve':'Felszerelés')+'</button>':(data.profile.level>=t.requiredLevel?'<button class="goldbtn buy-tool" data-id="'+t.id+'">Vásárlás</button>':'')}</article>`).join('')}</div></section>`}
function simplePage(kind){const cfg={cave:['◈ BÁNYÁSZ BARLANG','Fúrás és mélység','Merülj egyre mélyebbre a barlangrendszerben.'],finance:['₣ PÉNZÜGY','Egyenleg és kérelmek','A játékegyenleg virtuális játékérték.'],transactions:['↕ TRANZAKCIÓK','Teljes pénzügyi napló','Minden eladás és jutalom naplózva.'],profile:['● PROFIL','Játékos adatok','Módosítsd a karaktered nevét.'],arena:['♜ BÁNYA-ARÉNA','Párharc','Küzdj meg egy másik bányásszal.'],race:['🏎 BÁNYAKOCSI','Verseny','Gyors verseny a mélyben.'],combine:['◆ ÉRC-KOMBINÁLÓ','3 érc → jutalom','Három azonos ércből kombináció.'],empire:['♜ BIRODALOM','Fejlesztés','Építs egyre nagyobb bányászati rendszert.'],challenge:['🎯 KIHÍVÁSOK','Napi próba','Teljesítsd a napi bányászati kihívást.']}[kind];if(kind==='finance')return `<section class="finance"><article class="panel"><div class="title"><span>BEFIZETÉS</span><h2>Virtuális egyenleg</h2></div><p>Ez nem automatikusan valódi pénz.</p><input placeholder="Összeg Ft-ban"><button class="goldbtn" onclick="toast('A kérelem funkció előkészítve.')">Kérelem küldése</button></article><article class="panel"><div class="title"><span>KIFIZETÉSI KÉRELEM</span><h2>Egyenlegből</h2></div><input placeholder="Összeg Ft-ban"><input placeholder="Számlatulajdonos"><input placeholder="IBAN / bankszámlaszám"><button class="goldbtn" onclick="toast('A kérelem funkció előkészítve.')">Kifizetési kérelem</button></article></section>`;if(kind==='transactions')return `<section class="panel">${baseHead(cfg[0],cfg[1])}<div class="list">${data.transactions.length?data.transactions.map(t=>`<div class="row"><span><b>${t.note||t.type}</b><small>${new Date(t.createdAt).toLocaleString('hu-HU')}</small></span><strong>${money(t.totalHuf)}</strong></div>`).join(''):'<p>Még nincs tranzakció.</p>'}</div></section>`;if(kind==='profile')return `<section class="panel">${baseHead(cfg[0],cfg[1])}<div class="stats"><div><span>EGYENLEG</span><b>${money(data.profile.balanceHuf)}</b></div><div><span>SZINT</span><b>LV. ${data.profile.level}</b></div><div><span>XP</span><b>${data.profile.xp}</b></div><div><span>ÜTÉSEK</span><b>${data.profile.rockHits}</b></div></div><input id="newname" value="${data.profile.characterName}" style="width:100%;margin-top:10px;padding:11px;background:#080807;color:#fff;border:1px solid #4a381e;border-radius:6px"><button class="goldbtn" id="saveName" style="margin-top:8px">Név mentése</button></section>`;return `<section class="panel feature"><div class="featureicon">${cfg[0][0]}</div><div>${baseHead(cfg[0],cfg[1])}<p>${cfg[2]}</p></div><button class="goldbtn" id="sideAction">JÁTÉK INDÍTÁSA</button></section>`}
function render(){if(!data)return;$('#bal').textContent=money(data.profile.balanceHuf);$('#uname').textContent=data.profile.characterName;$('#topname').textContent=data.profile.characterName;$('#lvl').textContent='LV. '+data.profile.level;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html=tab==='mine'?minePage():tab==='market'?marketPage():tab==='machines'?machinesPage():simplePage(tab);$('#main').innerHTML=html;document.querySelectorAll('[data-rock]').forEach(b=>b.onclick=()=>{window.rock=b.dataset.rock;render()});$('#mineBtn')?.addEventListener('click',async()=>{try{const r=await api('/mine',{method:'POST',body:JSON.stringify({rock:window.rock||'normal'})});toast(`+${r.oreFound.quantity} ${r.oreFound.displayName} · +${r.xpGained} XP`);await refresh()}catch(e){toast(e.message)}});document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=async()=>{try{const qty=Number($('#q-'+b.dataset.sell).value);const r=await api('/sell',{method:'POST',body:JSON.stringify({ore:b.dataset.sell,quantity:qty})});toast('+'+money(r.amount));await refresh()}catch(e){toast(e.message)}});document.querySelectorAll('.buy-tool').forEach(b=>b.onclick=async()=>{try{await api('/buy-tool',{method:'POST',body:JSON.stringify({id:b.dataset.id})});await refresh()}catch(e){toast(e.message)}});document.querySelectorAll('.equip').forEach(b=>b.onclick=async()=>{try{await api('/equip-tool',{method:'POST',body:JSON.stringify({id:b.dataset.id})});await refresh()}catch(e){toast(e.message)}});document.querySelectorAll('.buy-machine').forEach(b=>b.onclick=async()=>{try{await api('/buy-machine',{method:'POST',body:JSON.stringify({id:b.dataset.id})});await refresh()}catch(e){toast(e.message)}});$('#saveName')?.addEventListener('click',async()=>{try{await api('/profile',{method:'POST',body:JSON.stringify({name:$('#newname').value})});await refresh()}catch(e){toast(e.message)}});$('#sideAction')?.addEventListener('click',async()=>{try{const r=await api('/side',{method:'POST',body:JSON.stringify({action:tab})});toast(r.message);await refresh()}catch(e){toast(e.message)}})}
async function refresh(){data=await api('/dashboard');render()}async function start(){shell();navRender();$('#logout').onclick=async()=>{await api('/logout');auth()};try{await refresh()}catch(e){auth()}}api('/session').then(x=>x.authenticated?start():auth()).catch(auth)
</script></body></html>
