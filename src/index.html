nclick=()=>p.remove();if(k==='spin')p.querySelector('#go').onclick=()=>{if(S.energy<1||S.spins>=50){toast('Nincs több pörgetés');return}S.energy--;S.spins++;['a','b','c'].forEach(id=>{let e=p.querySelector('#'+id),n=0,t=setInterval(()=>{e.textContent=['🎮','💰','💎','⚡','📦','⭐'][Math.floor(Math.random()*6)];if(++n>18){clearInterval(t);toast('JUTALOM: +50 000 Ft')}},55)})}}document.querySelectorAll('.hot').forEach(b=>b.onclick=()=>panel(b.dataset.open));</script></body></html>
